[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muscles-sse"
version = "1.0.1"
description = "SSE adapter for Muscles streaming events"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["muscles>=1.0.0rc1,<2.0.0"]

[project.urls]
Homepage = "https://github.com/butkoden/muscles-sse"
Repository = "https://github.com/butkoden/muscles-sse"
Documentation = "https://github.com/butkoden/muscles-sse#readme"
PyPI = "https://pypi.org/project/muscles-sse/"
Releases = "https://github.com/butkoden/muscles-sse/releases"
"muscles" = "https://pypi.org/project/muscles/"
"muscles-asgi" = "https://pypi.org/project/muscles-asgi/"
"muscles-ai" = "https://pypi.org/project/muscles-ai/"
"muscles-jsonrpc" = "https://pypi.org/project/muscles-jsonrpc/"
"muscles-benchmarks" = "https://pypi.org/project/muscles-benchmarks/"

[tool.pytest.ini_options]
testpaths = ["tests"]
